[package]
name = "chroma-edge"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio-stream = "0.1"

chroma-core = { version = "0.1.0", path = "../chroma-core" }
lazy_static = "1.5.0"
salvo = { version = "0.93.0", features = ["cors", "websocket", "oapi", "serve-static", "affix-state"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
uuid = { version = "1.12", features = ["v4"] }
chrono = "0.4"
serialport = "4.9.0"
tokio-serial = "5.4.4"
tokio-modbus = "0.14.0"
rust-embed = "8.11.0"
mime_guess = "2.0.5"

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3.0.0"


