syntax = "proto3";

package sila2.org.silastandard.core.chromatographservice.v1;

option go_package = "chromatography-workstation/edge/internal/sila2/pb;pb";

import "SiLAFramework.proto";

// The standard SiLA 2 service for a Chromatography device
service ChromatographService {
  // Starts a new chromatography run
  rpc StartRun(StartRun_Parameters) returns (StartRun_Responses) {}

  // Stops the current run (Graceful stop)
  rpc StopRun(StopRun_Parameters) returns (StopRun_Responses) {}

  // Pauses the current run
  rpc PauseRun(PauseRun_Parameters) returns (PauseRun_Responses) {}

  // Resumes a paused run
  rpc ResumeRun(ResumeRun_Parameters) returns (ResumeRun_Responses) {}

  // Aborts the current run (Emergency stop)
  rpc AbortRun(AbortRun_Parameters) returns (AbortRun_Responses) {}

  // Gets the current standard state of the digital twin
  rpc GetState(GetState_Parameters) returns (GetState_Responses) {}
}

message StartRun_Parameters {}
message StartRun_Responses {}

message StopRun_Parameters {}
message StopRun_Responses {}

message PauseRun_Parameters {}
message PauseRun_Responses {}

message ResumeRun_Parameters {}
message ResumeRun_Responses {}

message AbortRun_Parameters {}
message AbortRun_Responses {}

message GetState_Parameters {}
message GetState_Responses {
  sila2.org.silastandard.String CurrentState = 1;
}
