syntax = "proto3";

package sila2.pneumatic;

option go_package = "chromatography-workstation/edge/internal/sila2/pb;pb";

service PneumaticControllerService {
  rpc SetTargetPressure(SetTargetPressureRequest) returns (SetTargetPressureResponse) {}
}

message SetTargetPressureRequest {
  string device_id = 1;
  string channel = 2; // e.g., carrier, h2, air
  double target_pressure = 3;
}

message SetTargetPressureResponse {
  bool success = 1;
  string message = 2;
}
