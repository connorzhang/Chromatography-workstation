<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOCs 色谱边缘工作站 {{.AppVersion}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="nav-item" data-target="view-dashboard">
            <div class="nav-icon">📊</div><div>大屏</div>
        </div>
        <div class="nav-item active" data-target="view-live">
            <div class="nav-icon">📈</div><div>谱图</div>
        </div>
        <div class="nav-item" data-target="view-method">
            <div class="nav-icon">🧪</div><div>方法</div>
        </div>
        <div class="nav-item" data-target="view-process">
            <div class="nav-icon">🔬</div><div>处理</div>
        </div>
        <div class="nav-item" data-target="view-report">
            <div class="nav-icon">📋</div><div>报表</div>
        </div>
        <div class="nav-item" data-target="view-settings">
            <div class="nav-icon">⚙️</div><div>设置</div>
        </div>
        <div class="nav-item" data-target="view-debug">
            <div class="nav-icon">🛠️</div><div>调试</div>
        </div>
        <div class="nav-item" data-target="view-tcd">
            <div class="nav-icon">🔬</div><div>TCD</div>
        </div>
        <div class="nav-item" data-target="view-epc">
            <div class="nav-icon">💨</div><div>EPC</div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h2><span id="header-title">实时概览</span> <span style="font-size:12px;color:#94a3b8;margin-left:10px;">{{.AppVersion}}</span></h2>
            <div id="status-badge" style="color:var(--success)">● 设备已连接</div>
        </div>

        <!-- 视图面板将通过 JS 动态渲染或显示 -->
        <div id="view-dashboard" class="view-panel"></div>
        <div id="view-live" class="view-panel active"></div>
        <div id="view-method" class="view-panel"></div>
        <div id="view-process" class="view-panel"></div>
        <div id="view-report" class="view-panel"></div>
        <div id="view-settings" class="view-panel"></div>
        <div id="view-debug" class="view-panel"></div>
        <div id="view-tcd" class="view-panel"></div>
        <div id="view-epc" class="view-panel"></div>
    </div>

    <script type="module" src="/static/js/app.js?v=0.3.137"></script>
</body>
</html>
